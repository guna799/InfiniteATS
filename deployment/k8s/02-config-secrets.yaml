apiVersion: v1
kind: ConfigMap
metadata:
  name: infinitecareers-config
  namespace: infinitecareers
data:
  SPRING_PROFILES_ACTIVE: "prod"
  NODE_ENV: "production"
  DATABASE_URL: "jdbc:postgresql://postgres-service:5432/infinitecareers"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  NEXT_PUBLIC_APP_URL: "https://careers.infinitecareers.io"
  NEXT_PUBLIC_API_URL: "https://careers.infinitecareers.io/api/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: infinitecareers-secrets
  namespace: infinitecareers
type: Opaque
stringData:
  POSTGRES_DB: "infinitecareers"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "ProductionSecureDbPassword2026!"
  REDIS_PASSWORD: "ProductionSecureRedisPassword2026!"
  APP_JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
