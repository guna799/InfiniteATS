# /api/v1 and /ws go to Spring Boot; everything else (including the
# Next.js /api/* route handlers) goes to the frontend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infinitecareers-ingress
  namespace: dev
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
