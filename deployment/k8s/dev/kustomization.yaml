# Base for the dev namespace. CI deploys through a generated overlay that pins image tags;
# see deployment/scripts/deploy-k8s-dev.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
- 01-config.yaml
- 10-postgres.yaml
- 11-redis.yaml
- 12-opensearch.yaml
- 20-backend.yaml
- 21-frontend.yaml
- 30-ingress.yaml
