apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinitecareers-backend
  namespace: dev
  labels:
    app: infinitecareers-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infinitecareers-backend
  template:
    metadata:
      labels:
        app: infinitecareers-backend
    spec:
      imagePullSecrets:
      - name: ghcr-pull  # optional; only needed while the GHCR packages are private
      containers:
      - name: backend
        image: infinitecareers/backend:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: infinitecareers-config
        env:
        - name: DATABASE_USER
          value: postgres
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef: {name: infinitecareers-secrets, key: POSTGRES_PASSWORD}
        - name: SPRING_DATA_REDIS_PASSWORD
          valueFrom:
            secretKeyRef: {name: infinitecareers-secrets, key: REDIS_PASSWORD}
        - name: APP_JWT_SECRET
          valueFrom:
            secretKeyRef: {name: infinitecareers-secrets, key: APP_JWT_SECRET}
        # Optional: sets passwords for existing staff users at startup (comma-separated emails).
        # Staff sign in through Spring, and seeded users ship without a usable password.
        - name: APP_BOOTSTRAP_ADMIN_EMAIL
          valueFrom:
            secretKeyRef: {name: infinitecareers-secrets, key: BOOTSTRAP_ADMIN_EMAIL, optional: true}
        - name: APP_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef: {name: infinitecareers-secrets, key: BOOTSTRAP_ADMIN_PASSWORD, optional: true}
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {memory: 1Gi}
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: dev
spec:
  selector:
    app: infinitecareers-backend
  ports:
  - port: 8080
    targetPort: 8080
