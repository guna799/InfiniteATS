version: '3.8'

services:
  # 1. PostgreSQL 16 Multi-Tenant Database
  postgres:
    image: postgres:16-alpine
    container_name: infinitecareers-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinitecareers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/schema:/docker-entrypoint-initdb.d/schema:ro
      - ../../database/seeds:/docker-entrypoint-initdb.d/seeds:ro
      - ../../database/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d infinitecareers"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infinitecareers-network

  # 2. Redis 7 Cache & Pub/Sub Bus
  redis:
    image: redis:7-alpine
    container_name: infinitecareers-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - infinitecareers-network

  # 3. Spring Boot 3 Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: infinitecareers-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/infinitecareers
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - infinitecareers-network

  # 4. Next.js 14 Frontend
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: infinitecareers-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://backend:8080/api/v1
    ports:
      - "3000:3000"
    networks:
      - infinitecareers-network

volumes:
  postgres_data:
  redis_data:

networks:
  infinitecareers-network:
    driver: bridge
