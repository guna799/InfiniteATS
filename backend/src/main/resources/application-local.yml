spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:infinitecareers;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

app:
  security:
    allow-tenant-header: true
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  realtime:
    fanout: local
  storage:
    provider: ${APP_STORAGE_PROVIDER:s3}
    s3:
      bucket: ${AWS_S3_BUCKET:infiniteatsbucket}
      region: ${AWS_REGION:us-east-2}
    local-dir: ./uploads
